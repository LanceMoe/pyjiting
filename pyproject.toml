[project]
name = "pyjiting"
dynamic = ["version"]
description = "A small typed Python subset JIT compiler built with llvmlite"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "LanceMoe" },
]
keywords = ["jit", "llvm", "compiler", "numpy", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "llvmlite>=0.49.0",
    "numpy>=2.5.2",
]

[project.urls]
Homepage = "https://github.com/LanceMoe/pyjiting"
Repository = "https://github.com/LanceMoe/pyjiting"
Issues = "https://github.com/LanceMoe/pyjiting/issues"

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "hypothesis>=6.120",
    "pyright>=1.1.400",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyjiting"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv*",
    "/.mypy_cache",
    "/.pytest_cache",
    "/__pycache__",
    "/dist",
    "/wheel-verify",
]

[tool.hatch.version]
path = "pyjiting/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["pyjiting"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
include = ["pyjiting", "tests"]
exclude = [".venv", ".mypy_cache", ".pytest_cache", "__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
