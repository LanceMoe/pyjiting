[project]
name = "pyjiting"
version = "0.1.0"
description = "A small typed Python subset JIT compiler built with llvmlite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llvmlite>=0.49.0",
    "numpy>=2.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyjiting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
