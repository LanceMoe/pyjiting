[project]
name = "pyjiting"
version = "0.2.0"
description = "A small typed Python subset JIT compiler built with llvmlite"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "LanceMoe" },
]
keywords = ["jit", "llvm", "compiler", "numpy", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "llvmlite>=0.49.0",
    "numpy>=2.5.2",
]

[project.urls]
Homepage = "https://github.com/LanceMoe/pyjiting"
Repository = "https://github.com/LanceMoe/pyjiting"
Issues = "https://github.com/LanceMoe/pyjiting/issues"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyjiting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["pyjiting", "tests"]
exclude = [".venv", ".mypy_cache", ".pytest_cache", "__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
